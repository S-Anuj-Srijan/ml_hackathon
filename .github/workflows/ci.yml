name: PathSnap quality gates
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest test_data_pipeline.GeometryTests.test_long_arc_midpoint_and_direction test_data_pipeline.GeometryTests.test_no_candidate_preserves_observation test_data_pipeline.GeometryTests.test_reference_alignment_follows_route_occurrences -v
      - run: python -m compileall -q api models mlops decoder.py data_pipeline.py
