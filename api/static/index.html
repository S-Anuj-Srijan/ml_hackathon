<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathSnap – Map Matching UI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --panel: #1a1d27;
            --card: #22263a;
            --card-hover: #2a2f47;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --text: #dfe6e9;
            --text-dim: #8395a7;
            --success: #00b894;
            --warn: #fdcb6e;
            --error: #d63031;
            --track: #fd79a8;
            --route: #00cec9;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ── Sidebar ─────────────────────────────────── */
        .sidebar {
            width: 380px;
            min-width: 380px;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.06);
            z-index: 1000;
        }

        .logo {
            padding: 24px 24px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo p {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .config-bar {
            padding: 12px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .config-bar label {
            font-size: 0.75rem;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .config-bar input {
            flex: 1;
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text);
            padding: 8px 12px;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .config-bar input:focus {
            border-color: var(--accent);
        }

        .trip-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trip-list::-webkit-scrollbar { width: 6px; }
        .trip-list::-webkit-scrollbar-track { background: transparent; }
        .trip-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .trip-card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius);
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .trip-card:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .trip-card.active {
            border-color: var(--accent);
            background: rgba(108, 92, 231, 0.12);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .trip-card .trip-id {
            font-weight: 600;
            font-size: 0.95rem;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
        }

        .trip-card .trip-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 6px;
            display: flex;
            gap: 14px;
        }

        .trip-card .trip-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .trip-card .accuracy-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            display: none;
        }

        .trip-card .accuracy-badge.show { display: inline-block; }
        .trip-card .accuracy-badge.high { background: rgba(0,184,148,0.2); color: var(--success); }
        .trip-card .accuracy-badge.mid  { background: rgba(253,203,110,0.2); color: var(--warn); }
        .trip-card .accuracy-badge.low  { background: rgba(214,48,49,0.2); color: var(--error); }

        .btn-predict-all {
            margin: 16px;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--accent), #a29bfe);
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-predict-all:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
        }

        .btn-predict-all:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-bar {
            padding: 12px 24px;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
        }

        .status-bar .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .dot.ok { background: var(--success); }
        .dot.err { background: var(--error); }
        .dot.loading { background: var(--warn); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ── Map ─────────────────────────────────────── */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Info overlay */
        .info-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(26, 29, 39, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            padding: 16px 20px;
            z-index: 1000;
            min-width: 240px;
            display: none;
        }

        .info-overlay.show { display: block; }

        .info-overlay h3 {
            font-size: 0.85rem;
            color: var(--accent2);
            margin-bottom: 10px;
        }

        .info-overlay .stat {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.8rem;
        }

        .info-overlay .stat .label { color: var(--text-dim); }
        .info-overlay .stat .value { font-weight: 600; font-family: monospace; }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 24px;
            right: 16px;
            background: rgba(26, 29, 39, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            padding: 12px 16px;
            z-index: 1000;
            font-size: 0.78rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
        }

        .legend-line {
            width: 24px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Loading spinner */
        .spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
        }

        .spinner.show { display: flex; flex-direction: column; align-items: center; gap: 12px; }

        .spinner-ring {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .spinner p { font-size: 0.85rem; color: var(--text-dim); }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            padding: 12px 24px;
            font-size: 0.85rem;
            z-index: 9999;
            transition: transform 0.3s ease;
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: var(--error); color: var(--error); }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <h1>⚡ PathSnap</h1>
            <p>GPS Map-Matching Prediction</p>
        </div>

        <div class="config-bar">
            <label for="api-url">API:</label>
            <input type="text" id="api-url" value="" placeholder="http://<laptop1-ip>:8000" />
        </div>

        <div class="trip-list" id="trip-list">
            <div style="text-align:center; padding:40px 0; color: var(--text-dim);">
                <p>Loading trips…</p>
            </div>
        </div>

        <button class="btn-predict-all" id="btn-predict-all" disabled>
            🚀 Predict All Trips
        </button>

        <div class="status-bar">
            <span id="status"><span class="dot loading"></span> Connecting…</span>
            <span id="trip-count">0 trips</span>
        </div>
    </div>

    <!-- Map -->
    <div class="map-container">
        <div id="map"></div>

        <div class="spinner" id="spinner">
            <div class="spinner-ring"></div>
            <p>Running prediction…</p>
        </div>

        <div class="info-overlay" id="info-overlay">
            <h3 id="info-title">Trip Details</h3>
            <div class="stat"><span class="label">Trip ID</span><span class="value" id="info-trip-id">—</span></div>
            <div class="stat"><span class="label">GPS Points</span><span class="value" id="info-points">—</span></div>
            <div class="stat"><span class="label">Predicted Arcs</span><span class="value" id="info-arcs">—</span></div>
            <div class="stat"><span class="label">Accuracy</span><span class="value" id="info-accuracy">—</span></div>
            <div class="stat"><span class="label">Pred. Time</span><span class="value" id="info-time">—</span></div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background: var(--track);"></div>
                <span>GPS Track</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: var(--route);"></div>
                <span>Predicted Route</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #55efc4; width:8px; height:8px;"></div>
                <span>Start</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #d63031; width:8px; height:8px;"></div>
                <span>End</span>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    // ── State ────────────────────────────────────────────────────────
    let trips = [];
    let predictions = {};   // trip_id → prediction result
    let activeTrip = null;

    // Map layers
    let map, trackLayer, routeLayer, markersLayer;

    // ── Init ─────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        // Auto-detect current origin (vital for two-laptop setup: automatically points to Laptop 1)
        const apiUrlInput = document.getElementById('api-url');
        if (window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file:')) {
            apiUrlInput.value = window.location.origin;
        } else if (!apiUrlInput.value) {
            apiUrlInput.value = 'http://localhost:8000';
        }

        initMap();
        loadTrips();

        document.getElementById('api-url').addEventListener('change', loadTrips);
        document.getElementById('btn-predict-all').addEventListener('click', predictAll);
    });

    function getApiUrl() {
        return document.getElementById('api-url').value.replace(/\/+$/, '');
    }

    // ── Map setup ────────────────────────────────────────────────────
    function initMap() {
        map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
        }).setView([50, 10], 5);

        // Dark tile layer (free OSM tiles + CSS invert for dark theme)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        // Apply dark filter to map tiles
        document.querySelector('.leaflet-tile-pane').style.filter =
            'invert(1) hue-rotate(180deg) brightness(0.8) contrast(1.2) saturate(0.3)';

        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        L.control.attribution({ position: 'bottomleft' }).addTo(map)
            .addAttribution('© <a href="https://osm.org/">OpenStreetMap</a>');

        trackLayer   = L.layerGroup().addTo(map);
        routeLayer   = L.layerGroup().addTo(map);
        markersLayer = L.layerGroup().addTo(map);
    }

    // ── Load trips ───────────────────────────────────────────────────
    async function loadTrips() {
        const url = getApiUrl();
        setStatus('loading', 'Connecting…');

        try {
            const res = await fetch(`${url}/trips`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            trips = data.trips;
            renderTripList();
            setStatus('ok', 'Connected');
            document.getElementById('trip-count').textContent = `${trips.length} trips`;
            document.getElementById('btn-predict-all').disabled = false;
            toast(`Loaded ${trips.length} trips`);
        } catch (e) {
            setStatus('err', 'Disconnected');
            document.getElementById('trip-list').innerHTML =
                `<div style="text-align:center; padding:40px 20px; color: var(--error);">
                    <p style="font-size:1.5rem; margin-bottom:8px;">⚠️</p>
                    <p>Cannot reach API at<br><code>${url}</code></p>
                    <p style="margin-top:12px; color: var(--text-dim); font-size:0.78rem;">
                        Check the API URL and ensure the server is running
                    </p>
                </div>`;
            toast('Connection failed – check API URL', true);
        }
    }

    // ── Render trip list ─────────────────────────────────────────────
    function renderTripList() {
        const list = document.getElementById('trip-list');
        list.innerHTML = '';

        trips.forEach(trip => {
            const card = document.createElement('div');
            card.className = 'trip-card';
            card.dataset.tripId = trip.trip_id;

            card.innerHTML = `
                <span class="accuracy-badge" id="badge-${trip.trip_id}"></span>
                <div class="trip-id">Trip #${trip.trip_id}</div>
                <div class="trip-meta">
                    <span>📍 ${trip.n_points} pts</span>
                    <span>🔗 ${trip.n_arcs} arcs</span>
                    <span>⬡ ${trip.n_nodes} nodes</span>
                </div>
            `;

            card.addEventListener('click', () => selectTrip(trip.trip_id));
            list.appendChild(card);
        });
    }

    // ── Select a trip ────────────────────────────────────────────────
    async function selectTrip(tripId) {
        // Update active card
        document.querySelectorAll('.trip-card').forEach(c => c.classList.remove('active'));
        const card = document.querySelector(`[data-trip-id="${tripId}"]`);
        if (card) card.classList.add('active');

        activeTrip = tripId;

        // If we already have a prediction, show it
        if (predictions[tripId]) {
            showPrediction(tripId, predictions[tripId]);
            return;
        }

        // Otherwise, run prediction
        await predictTrip(tripId);
    }

    // ── Predict a single trip ────────────────────────────────────────
    async function predictTrip(tripId) {
        const url = getApiUrl();
        showSpinner(true);

        try {
            const res = await fetch(`${url}/predict/${tripId}`, { method: 'POST' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            predictions[tripId] = data;
            showPrediction(tripId, data);
            updateBadge(tripId, data.accuracy);
            toast(`Trip #${tripId} – accuracy: ${data.accuracy !== null && data.accuracy !== undefined ? (data.accuracy * 100).toFixed(1) + '%' : 'N/A'}`);
        } catch (e) {
            toast(`Prediction failed for trip #${tripId}`, true);
        } finally {
            showSpinner(false);
        }
    }

    // ── Predict all trips ────────────────────────────────────────────
    async function predictAll() {
        const btn = document.getElementById('btn-predict-all');
        btn.disabled = true;
        btn.textContent = '⏳ Predicting…';

        for (const trip of trips) {
            await predictTrip(trip.trip_id);
            // Brief pause for visual feedback
            await new Promise(r => setTimeout(r, 200));
        }

        btn.textContent = '✅ All Predicted';
        setTimeout(() => {
            btn.textContent = '🚀 Predict All Trips';
            btn.disabled = false;
        }, 2000);

        // Show summary
        const accs = Object.values(predictions)
            .filter(p => p.accuracy !== null && p.accuracy !== undefined)
            .map(p => p.accuracy);
        if (accs.length > 0) {
            const avg = (accs.reduce((a, b) => a + b, 0) / accs.length * 100).toFixed(1);
            toast(`All done! Average accuracy: ${avg}%`);
        }
    }

    // ── Show prediction on map ───────────────────────────────────────
    function showPrediction(tripId, data) {
        // Clear layers
        trackLayer.clearLayers();
        routeLayer.clearLayers();
        markersLayer.clearLayers();

        const track = data.track;    // [[lon, lat], ...]
        const route = data.route_geometry;  // [{from: [lon,lat], to: [lon,lat]}, ...]

        if (!track || track.length === 0) return;

        // Draw GPS track (pink dots + line)
        const trackLatLngs = track.map(p => [p[1], p[0]]);

        L.polyline(trackLatLngs, {
            color: '#fd79a8',
            weight: 3,
            opacity: 0.7,
            dashArray: '8,6',
        }).addTo(trackLayer);

        // GPS point dots (subtle)
        trackLatLngs.forEach((ll, i) => {
            if (i % Math.max(1, Math.floor(track.length / 50)) === 0) {
                L.circleMarker(ll, {
                    radius: 2.5,
                    fillColor: '#fd79a8',
                    fillOpacity: 0.6,
                    color: 'transparent',
                }).addTo(trackLayer);
            }
        });

        // Draw predicted route (teal lines)
        if (route && route.length > 0) {
            route.forEach(seg => {
                L.polyline(
                    [[seg.from[1], seg.from[0]], [seg.to[1], seg.to[0]]],
                    { color: '#00cec9', weight: 4, opacity: 0.9 }
                ).addTo(routeLayer);
            });
        }

        // Start & end markers
        const startIcon = L.divIcon({
            html: '<div style="width:14px;height:14px;background:#55efc4;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px rgba(85,239,196,0.6);"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7],
            className: '',
        });

        const endIcon = L.divIcon({
            html: '<div style="width:14px;height:14px;background:#d63031;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px rgba(214,48,49,0.6);"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7],
            className: '',
        });

        L.marker(trackLatLngs[0], { icon: startIcon }).addTo(markersLayer)
            .bindPopup('Start');
        L.marker(trackLatLngs[trackLatLngs.length - 1], { icon: endIcon }).addTo(markersLayer)
            .bindPopup('End');

        // Fit map to bounds
        const allPoints = [...trackLatLngs];
        if (route) {
            route.forEach(seg => {
                allPoints.push([seg.from[1], seg.from[0]]);
                allPoints.push([seg.to[1], seg.to[0]]);
            });
        }
        map.fitBounds(L.latLngBounds(allPoints).pad(0.1));

        // Update info overlay
        const overlay = document.getElementById('info-overlay');
        overlay.classList.add('show');
        document.getElementById('info-trip-id').textContent = tripId;
        document.getElementById('info-points').textContent = track.length;
        document.getElementById('info-arcs').textContent = data.n_predicted_arcs;
        document.getElementById('info-accuracy').textContent =
            data.accuracy !== null && data.accuracy !== undefined
                ? `${(data.accuracy * 100).toFixed(1)}%`
                : 'N/A';
        document.getElementById('info-time').textContent = `${data.prediction_time_ms}ms`;
    }

    // ── Badge ────────────────────────────────────────────────────────
    function updateBadge(tripId, accuracy) {
        const badge = document.getElementById(`badge-${tripId}`);
        if (!badge || accuracy === null || accuracy === undefined) return;

        const pct = (accuracy * 100).toFixed(0);
        badge.textContent = `${pct}%`;
        badge.classList.add('show');
        badge.classList.remove('high', 'mid', 'low');
        if (accuracy >= 0.5) badge.classList.add('high');
        else if (accuracy >= 0.25) badge.classList.add('mid');
        else badge.classList.add('low');
    }

    // ── Helpers ──────────────────────────────────────────────────────
    function setStatus(type, text) {
        const el = document.getElementById('status');
        const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'loading';
        el.innerHTML = `<span class="dot ${cls}"></span> ${text}`;
    }

    function showSpinner(show) {
        document.getElementById('spinner').classList.toggle('show', show);
    }

    function toast(msg, isError = false) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast show' + (isError ? ' error' : '');
        setTimeout(() => el.classList.remove('show'), 3000);
    }
    </script>
</body>
</html>
