<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathSnap – AI Map-Matching Telemetry</title>
    <!-- Leaflet & Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0c10;
            --surface: #12151f;
            --surface-elevated: #1a1e2e;
            --surface-hover: #22273d;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.6);
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --cyan: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.35);
            --pink: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
            --accent: #8b5cf6;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        /* ── Sidebar ──────────────────────────────────────────────────────── */
        .sidebar {
            width: 400px;
            min-width: 400px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            z-index: 1000;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.3);
        }

        .header {
            padding: 22px 24px 18px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.06) 0%, transparent 100%);
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--cyan));
            border-radius: var(--radius-md);
            display: grid;
            place-items: center;
            font-size: 1.15rem;
            box-shadow: 0 0 16px var(--primary-glow);
        }

        .brand-title h1 {
            font-size: 1.35rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 40%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.03em;
        }

        .badge-live {
            font-size: 0.68rem;
            font-weight: 700;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-glow 1.5s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        .brand-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Config / Connection Bar */
        .api-config {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .api-config label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .api-config input {
            flex: 1;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            padding: 6px 10px;
            font-size: 0.78rem;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: border-color 0.2s;
        }

        .api-config input:focus {
            border-color: var(--primary);
        }

        .btn-refresh {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-refresh:hover {
            color: var(--text-main);
            background: var(--surface-hover);
        }

        /* Trips List */
        .list-section-header {
            padding: 14px 20px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .list-section-header span {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .trip-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trip-list::-webkit-scrollbar { width: 5px; }
        .trip-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }

        .trip-card {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .trip-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: transparent;
            transition: background 0.2s;
        }

        .trip-card:hover {
            background: var(--surface-hover);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateX(3px);
        }

        .trip-card.active {
            background: rgba(99, 102, 241, 0.12);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .trip-card.active::before {
            background: linear-gradient(180deg, var(--primary), var(--cyan));
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .trip-name {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.88rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-acc {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            display: none;
        }

        .badge-acc.show { display: inline-block; }
        .badge-acc.high { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-acc.mid  { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-acc.low  { background: rgba(244, 63, 94, 0.2); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

        .card-stats {
            margin-top: 8px;
            display: flex;
            gap: 12px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .card-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-tray {
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
        }

        .btn-predict-all {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-predict-all:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
        }

        .btn-predict-all:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .statusbar {
            padding: 10px 18px;
            font-size: 0.72rem;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ── Map Viewport ─────────────────────────────────────────────────── */
        .map-viewport {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #08090d;
        }

        /* HUD Overlays (Glassmorphic) */
        .hud-telemetry {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(18, 21, 31, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            z-index: 1000;
            box-shadow: var(--shadow-glass);
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .hud-telemetry.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .hud-header h3 {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--cyan);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-score-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 14px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .score-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .score-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
        }

        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .hud-cell {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
        }

        .cell-k {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-dim);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .cell-v {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 2px;
        }

        /* Simulator Playback Controls */
        .playback-card {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 21, 31, 0.9);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 18px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
        }

        .playback-card.hide {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(20px);
        }

        .btn-play {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--cyan), var(--primary));
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s;
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .btn-play:hover {
            transform: scale(1.08);
        }

        .scrubber-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 220px;
        }

        .scrubber-slider {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
        }

        .scrubber-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px var(--cyan);
        }

        .speed-badge {
            font-size: 0.72rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
        }

        /* Map Controls (Top Left & Bottom Right) */
        .map-layer-toggles {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(18, 21, 31, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            z-index: 1000;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .layer-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
            user-select: none;
        }

        .layer-toggle:hover { color: var(--text-main); }

        .layer-toggle input {
            accent-color: var(--primary);
            cursor: pointer;
        }

        .basemap-selector {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 4px;
        }

        .btn-basemap {
            font-size: 0.68rem;
            padding: 3px 6px;
            border-radius: 4px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
        }

        .btn-basemap.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Arc Sequence Drawer */
        .hud-actions {
            display: flex;
            gap: 8px;
        }

        .btn-hud-action {
            flex: 1;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-hud-action:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }

        /* Loading Spinner */
        .map-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(18, 21, 31, 0.9);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 28px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            box-shadow: var(--shadow-glass);
        }

        .map-spinner.active { display: flex; }

        .spinner-glow {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(99, 102, 241, 0.15);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Vehicle Animation Marker */
        .vehicle-marker {
            width: 18px;
            height: 18px;
            background: var(--cyan);
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 16px var(--cyan);
            transition: transform 0.05s linear;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 18px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 9999;
            box-shadow: var(--shadow-glass);
            transform: translateY(60px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- ── Sidebar ── -->
    <div class="sidebar">
        <div class="header">
            <div class="brand-row">
                <div class="brand-title">
                    <div class="brand-icon">⚡</div>
                    <div>
                        <h1>PathSnap</h1>
                    </div>
                </div>
                <div class="badge-live">
                    <span class="pulse-dot"></span> Live Ready
                </div>
            </div>
            <p class="brand-sub">Neural GPS Map-Matching & Telemetry Engine</p>
        </div>

        <div class="api-config">
            <label for="api-url">Host:</label>
            <input type="text" id="api-url" value="" placeholder="http://<laptop1-ip>:8000" />
            <button class="btn-refresh" id="btn-reconnect" title="Reconnect">↻</button>
        </div>

        <div class="list-section-header">
            <span>Evaluator Trips</span>
            <span id="trip-count" style="font-family:'JetBrains Mono'; color:var(--cyan);">0 loaded</span>
        </div>

        <div class="trip-list" id="trip-list">
            <div style="text-align:center; padding:40px 0; color:var(--text-dim); font-size:0.85rem;">
                Connecting to backend…
            </div>
        </div>

        <div class="action-tray">
            <button class="btn-predict-all" id="btn-predict-all" disabled>
                <span>🚀</span> Batch Predict All 10 Trips
            </button>
        </div>

        <div class="statusbar">
            <span id="status-indicator">● Connecting…</span>
            <span style="font-family:'JetBrains Mono'; font-size:0.68rem;">Member D • Laptop 2</span>
        </div>
    </div>

    <!-- ── Map Viewport ── -->
    <div class="map-viewport">
        <div id="map"></div>

        <!-- Layer & Basemap Toggles -->
        <div class="map-layer-toggles">
            <label class="layer-toggle">
                <input type="checkbox" id="chk-route" checked>
                <span>Predicted Route (Teal)</span>
            </label>
            <label class="layer-toggle">
                <input type="checkbox" id="chk-track" checked>
                <span>Raw GPS Track (Pink)</span>
            </label>
            <label class="layer-toggle">
                <input type="checkbox" id="chk-markers" checked>
                <span>Start / Finish Pins</span>
            </label>
            <div class="basemap-selector">
                <button class="btn-basemap active" data-map="dark">Dark</button>
                <button class="btn-basemap" data-map="satellite">Satellite</button>
                <button class="btn-basemap" data-map="osm">Streets</button>
            </div>
        </div>

        <!-- Telemetry HUD Card -->
        <div class="hud-telemetry" id="hud-telemetry">
            <div class="hud-header">
                <h3 id="hud-trip-title">Trip #00000000</h3>
                <span class="badge-acc" id="hud-acc-badge">0%</span>
            </div>

            <div class="hud-score-row">
                <div class="score-label">Jaccard Alignment Accuracy</div>
                <div class="score-val" id="hud-acc-val">—</div>
            </div>

            <div class="hud-grid">
                <div class="hud-cell">
                    <div class="cell-k">GPS Fixes</div>
                    <div class="cell-v" id="hud-pts">—</div>
                </div>
                <div class="hud-cell">
                    <div class="cell-k">Traversed Arcs</div>
                    <div class="cell-v" id="hud-arcs">—</div>
                </div>
                <div class="hud-cell">
                    <div class="cell-k">Route Distance</div>
                    <div class="cell-v" id="hud-dist">—</div>
                </div>
                <div class="hud-cell">
                    <div class="cell-k">Latency</div>
                    <div class="cell-v" id="hud-time" style="color:var(--cyan);">—</div>
                </div>
            </div>

            <div class="hud-actions">
                <button class="btn-hud-action" id="btn-export-geojson">
                    <span>📥</span> Export GeoJSON
                </button>
                <button class="btn-hud-action" id="btn-fit-bounds">
                    <span>⛶</span> Re-center
                </button>
            </div>
        </div>

        <!-- Simulation Playback Controller -->
        <div class="playback-card hide" id="playback-card">
            <button class="btn-play" id="btn-play-pause" title="Play/Pause Simulation">▶</button>
            <div class="scrubber-wrap">
                <input type="range" class="scrubber-slider" id="sim-scrubber" min="0" max="100" value="0">
            </div>
            <div class="speed-badge" id="btn-speed" title="Toggle Speed">1x</div>
        </div>

        <!-- Loading Spinner -->
        <div class="map-spinner" id="map-spinner">
            <div class="spinner-glow"></div>
            <p style="font-size:0.8rem; font-weight:600; color:var(--text-main);">Running Inference Pipeline…</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
    // ── Application State ────────────────────────────────────────────────
    let trips = [];
    let predictions = {};
    let activeTripId = null;

    // Simulation state
    let simInterval = null;
    let simProgress = 0;
    let simSpeedMultiplier = 1;
    let simSpeeds = [1, 2, 5, 10];
    let simSpeedIdx = 0;
    let vehicleMarker = null;

    // Map & Layers
    let map;
    let trackLayer, routeLayer, markersLayer;
    let tileLayers = {};
    let currentBasemap = 'dark';

    // ── Initialization ──────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        // Auto-detect current origin (crucial for Laptop 2 LAN connectivity)
        const apiUrlInput = document.getElementById('api-url');
        if (window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file:')) {
            apiUrlInput.value = window.location.origin;
        } else if (!apiUrlInput.value) {
            apiUrlInput.value = 'http://localhost:8000';
        }

        initMap();
        loadTrips();

        // UI Listeners
        document.getElementById('btn-reconnect').addEventListener('click', loadTrips);
        document.getElementById('api-url').addEventListener('change', loadTrips);
        document.getElementById('btn-predict-all').addEventListener('click', predictAll);

        // Layer checkbox listeners
        document.getElementById('chk-route').addEventListener('change', e => toggleLayer(routeLayer, e.target.checked));
        document.getElementById('chk-track').addEventListener('change', e => toggleLayer(trackLayer, e.target.checked));
        document.getElementById('chk-markers').addEventListener('change', e => toggleLayer(markersLayer, e.target.checked));

        // Basemap selector listeners
        document.querySelectorAll('.btn-basemap').forEach(btn => {
            btn.addEventListener('click', () => switchBasemap(btn.dataset.map));
        });

        // Simulation listeners
        document.getElementById('btn-play-pause').addEventListener('click', toggleSimulation);
        document.getElementById('sim-scrubber').addEventListener('input', onScrub);
        document.getElementById('btn-speed').addEventListener('click', toggleSpeed);

        // HUD buttons
        document.getElementById('btn-export-geojson').addEventListener('click', exportGeoJSON);
        document.getElementById('btn-fit-bounds').addEventListener('click', () => {
            if (activeTripId && predictions[activeTripId]) fitMapToTrip(predictions[activeTripId]);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', handleKeyNavigation);
    });

    function getApiUrl() {
        return document.getElementById('api-url').value.replace(/\/+$/, '');
    }

    // ── Map Setup ───────────────────────────────────────────────────────
    function initMap() {
        map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
        }).setView([56.1, 54.5], 10);

        // Tile layer 1: Dark Mode OpenStreetMap (inverted via CSS)
        tileLayers.dark = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            className: 'dark-tiles'
        });

        // Tile layer 2: Satellite Imagery (Esri World Imagery)
        tileLayers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        });

        // Tile layer 3: Standard OpenStreetMap
        tileLayers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        });

        tileLayers.dark.addTo(map);

        // Apply dark filter to map container
        applyTileFilter(true);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        trackLayer   = L.layerGroup().addTo(map);
        routeLayer   = L.layerGroup().addTo(map);
        markersLayer = L.layerGroup().addTo(map);
    }

    function switchBasemap(name) {
        document.querySelectorAll('.btn-basemap').forEach(b => b.classList.toggle('active', b.dataset.map === name));
        
        map.removeLayer(tileLayers[currentBasemap]);
        currentBasemap = name;
        tileLayers[name].addTo(map);

        applyTileFilter(name === 'dark');
    }

    function applyTileFilter(isDark) {
        const pane = document.querySelector('.leaflet-tile-pane');
        if (pane) {
            pane.style.filter = isDark 
                ? 'invert(1) hue-rotate(180deg) brightness(0.85) contrast(1.15) saturate(0.2)' 
                : 'none';
        }
    }

    function toggleLayer(layer, isVisible) {
        if (isVisible) map.addLayer(layer);
        else map.removeLayer(layer);
    }

    // ── Data Fetching ───────────────────────────────────────────────────
    async function loadTrips() {
        const url = getApiUrl();
        setIndicator('connecting', 'Connecting…');

        try {
            const res = await fetch(`${url}/trips`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            trips = data.trips;
            renderTripCards();
            setIndicator('connected', 'Connected');
            document.getElementById('trip-count').textContent = `${trips.length} loaded`;
            document.getElementById('btn-predict-all').disabled = false;
            toast(`Discovered ${trips.length} test trips`);

            // Auto-select first trip
            if (trips.length > 0 && !activeTripId) {
                selectTrip(trips[0].trip_id);
            }
        } catch (e) {
            setIndicator('error', 'Disconnected');
            document.getElementById('trip-list').innerHTML = `
                <div style="text-align:center; padding:36px 16px; color:#ef4444;">
                    <div style="font-size:1.6rem; margin-bottom:8px;">📡</div>
                    <div style="font-weight:600; font-size:0.85rem;">Backend Unreachable</div>
                    <div style="color:var(--text-dim); font-size:0.75rem; margin-top:4px;">
                        Check that <code>run_server.py</code> is active on Laptop 1.
                    </div>
                </div>`;
            toast('Cannot reach API server', true);
        }
    }

    // ── UI Rendering ────────────────────────────────────────────────────
    function renderTripCards() {
        const list = document.getElementById('trip-list');
        list.innerHTML = '';

        trips.forEach(trip => {
            const card = document.createElement('div');
            card.className = 'trip-card';
            card.dataset.tripId = trip.trip_id;

            card.innerHTML = `
                <div class="card-top">
                    <div class="trip-name">
                        <span style="color:var(--cyan);">#</span>${trip.trip_id}
                    </div>
                    <span class="badge-acc" id="badge-${trip.trip_id}"></span>
                </div>
                <div class="card-stats">
                    <span>📍 ${trip.n_points} fixes</span>
                    <span>🔗 ${trip.n_arcs} arcs</span>
                </div>
            `;

            card.addEventListener('click', () => selectTrip(trip.trip_id));
            list.appendChild(card);
        });
    }

    // ── Trip Selection & Prediction ─────────────────────────────────────
    async function selectTrip(tripId) {
        document.querySelectorAll('.trip-card').forEach(c => c.classList.remove('active'));
        const card = document.querySelector(`[data-trip-id="${tripId}"]`);
        if (card) card.classList.add('active');

        activeTripId = tripId;
        stopSimulation();

        if (predictions[tripId]) {
            displayPrediction(tripId, predictions[tripId]);
            return;
        }

        await runPrediction(tripId);
    }

    async function runPrediction(tripId) {
        const url = getApiUrl();
        showSpinner(true);

        try {
            const res = await fetch(`${url}/predict/${tripId}`, { method: 'POST' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            predictions[tripId] = data;
            
            displayPrediction(tripId, data);
            updateTripBadge(tripId, data.accuracy);
            toast(`Inference complete for Trip #${tripId}`);
        } catch (e) {
            toast(`Inference failed for trip #${tripId}`, true);
        } finally {
            showSpinner(false);
        }
    }

    async function predictAll() {
        const btn = document.getElementById('btn-predict-all');
        btn.disabled = true;
        btn.innerHTML = '<span>⏳</span> Processing 10 Trips…';

        for (const trip of trips) {
            await runPrediction(trip.trip_id);
            await new Promise(r => setTimeout(r, 120));
        }

        btn.innerHTML = '<span>✅</span> All 10 Predicted';
        setTimeout(() => {
            btn.innerHTML = '<span>🚀</span> Batch Predict All 10 Trips';
            btn.disabled = false;
        }, 2200);

        const accuracies = Object.values(predictions).map(p => p.accuracy).filter(a => a !== null && a !== undefined);
        if (accuracies.length > 0) {
            const meanAcc = (accuracies.reduce((a, b) => a + b, 0) / accuracies.length * 100).toFixed(1);
            toast(`Evaluated all 10 trips! Mean accuracy: ${meanAcc}%`);
        }
    }

    // ── Map Display ─────────────────────────────────────────────────────
    function displayPrediction(tripId, data) {
        trackLayer.clearLayers();
        routeLayer.clearLayers();
        markersLayer.clearLayers();

        const track = data.track || [];
        const route = data.route_geometry || [];

        if (track.length === 0) return;

        const trackLatLngs = track.map(p => [p[1], p[0]]);

        // 1. Draw Raw GPS Track (pink dotted trail)
        L.polyline(trackLatLngs, {
            color: '#f43f5e',
            weight: 2.5,
            opacity: 0.65,
            dashArray: '6, 6',
        }).addTo(trackLayer);

        // Sub-sample breadcrumb dots
        const step = Math.max(1, Math.floor(track.length / 40));
        trackLatLngs.forEach((pt, idx) => {
            if (idx % step === 0) {
                L.circleMarker(pt, {
                    radius: 2,
                    fillColor: '#f43f5e',
                    fillOpacity: 0.7,
                    color: 'transparent',
                }).addTo(trackLayer);
            }
        });

        // 2. Draw Predicted Route Segments (neon cyan glow)
        if (route.length > 0) {
            route.forEach(seg => {
                const segLatLngs = [
                    [seg.from[1], seg.from[0]],
                    [seg.to[1], seg.to[0]]
                ];
                // Outer glow
                L.polyline(segLatLngs, {
                    color: '#06b6d4',
                    weight: 5,
                    opacity: 0.4,
                }).addTo(routeLayer);
                // Core line
                L.polyline(segLatLngs, {
                    color: '#38bdf8',
                    weight: 3,
                    opacity: 0.95,
                }).addTo(routeLayer);
            });
        }

        // 3. Origin & Destination Markers
        const originPin = L.divIcon({
            html: '<div style="width:14px;height:14px;background:#10b981;border-radius:50%;border:2px solid #fff;box-shadow:0 0 12px #10b981;"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7],
            className: ''
        });
        const destPin = L.divIcon({
            html: '<div style="width:14px;height:14px;background:#f43f5e;border-radius:50%;border:2px solid #fff;box-shadow:0 0 12px #f43f5e;"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7],
            className: ''
        });

        L.marker(trackLatLngs[0], { icon: originPin }).addTo(markersLayer).bindPopup('Origin (T=0)');
        L.marker(trackLatLngs[trackLatLngs.length - 1], { icon: destPin }).addTo(markersLayer).bindPopup('Destination');

        fitMapToTrip(data);
        updateTelemetryHUD(tripId, data);

        // Show playback controller
        document.getElementById('playback-card').classList.remove('hide');
        simProgress = 0;
        document.getElementById('sim-scrubber').value = 0;
    }

    function fitMapToTrip(data) {
        const bounds = [];
        (data.track || []).forEach(p => bounds.push([p[1], p[0]]));
        if (bounds.length > 0) {
            map.fitBounds(L.latLngBounds(bounds).pad(0.12));
        }
    }

    // ── Telemetry & Metrics HUD ─────────────────────────────────────────
    function updateTelemetryHUD(tripId, data) {
        const hud = document.getElementById('hud-telemetry');
        hud.classList.add('active');

        document.getElementById('hud-trip-title').textContent = `Trip #${tripId}`;

        const accBadge = document.getElementById('hud-acc-badge');
        const accVal = document.getElementById('hud-acc-val');

        if (data.accuracy !== null && data.accuracy !== undefined) {
            const pct = (data.accuracy * 100).toFixed(1);
            accVal.textContent = `${pct}%`;
            accBadge.textContent = `${pct}% MATCH`;
            accBadge.className = 'badge-acc show ' + (data.accuracy >= 0.5 ? 'high' : data.accuracy >= 0.25 ? 'mid' : 'low');
        } else {
            accVal.textContent = 'N/A';
            accBadge.textContent = 'UNSCORED';
            accBadge.className = 'badge-acc show mid';
        }

        document.getElementById('hud-pts').textContent = (data.track || []).length;
        document.getElementById('hud-arcs').textContent = data.n_predicted_arcs || 0;
        document.getElementById('hud-time').textContent = `${data.prediction_time_ms} ms`;

        // Calculate approximate distance along track
        let distMeters = 0;
        const track = data.track || [];
        for (let i = 1; i < track.length; i++) {
            distMeters += map.distance([track[i-1][1], track[i-1][0]], [track[i][1], track[i][0]]);
        }
        const distKm = (distMeters / 1000).toFixed(2);
        document.getElementById('hud-dist').textContent = `${distKm} km`;
    }

    function updateTripBadge(tripId, accuracy) {
        const badge = document.getElementById(`badge-${tripId}`);
        if (!badge || accuracy === null || accuracy === undefined) return;

        const pct = (accuracy * 100).toFixed(0);
        badge.textContent = `${pct}%`;
        badge.className = 'badge-acc show ' + (accuracy >= 0.5 ? 'high' : accuracy >= 0.25 ? 'mid' : 'low');
    }

    // ── Simulation Engine ───────────────────────────────────────────────
    function toggleSimulation() {
        if (simInterval) {
            stopSimulation();
        } else {
            startSimulation();
        }
    }

    function startSimulation() {
        if (!activeTripId || !predictions[activeTripId]) return;
        const data = predictions[activeTripId];
        const track = data.track || [];
        if (track.length === 0) return;

        document.getElementById('btn-play-pause').textContent = '⏸';

        if (!vehicleMarker) {
            const vIcon = L.divIcon({
                html: '<div class="vehicle-marker"></div>',
                iconSize: [18, 18],
                iconAnchor: [9, 9],
                className: ''
            });
            vehicleMarker = L.marker([track[0][1], track[0][0]], { icon: vIcon }).addTo(markersLayer);
        }

        simInterval = setInterval(() => {
            simProgress += 0.5 * simSpeedMultiplier;
            if (simProgress >= 100) {
                simProgress = 100;
                stopSimulation();
            }

            document.getElementById('sim-scrubber').value = simProgress;
            updateVehiclePosition(track, simProgress);
        }, 50);
    }

    function stopSimulation() {
        if (simInterval) {
            clearInterval(simInterval);
            simInterval = null;
        }
        document.getElementById('btn-play-pause').textContent = '▶';
    }

    function onScrub(e) {
        simProgress = parseFloat(e.target.value);
        if (activeTripId && predictions[activeTripId]) {
            const track = predictions[activeTripId].track || [];
            updateVehiclePosition(track, simProgress);
        }
    }

    function updateVehiclePosition(track, pct) {
        if (!track || track.length === 0) return;
        const idx = Math.min(track.length - 1, Math.floor((pct / 100) * track.length));
        const pt = track[idx];
        if (vehicleMarker) {
            vehicleMarker.setLatLng([pt[1], pt[0]]);
        }
    }

    function toggleSpeed() {
        simSpeedIdx = (simSpeedIdx + 1) % simSpeeds.length;
        simSpeedMultiplier = simSpeeds[simSpeedIdx];
        document.getElementById('btn-speed').textContent = `${simSpeedMultiplier}x`;
    }

    // ── Export GeoJSON ──────────────────────────────────────────────────
    function exportGeoJSON() {
        if (!activeTripId || !predictions[activeTripId]) return;
        const data = predictions[activeTripId];

        const geojson = {
            type: "FeatureCollection",
            properties: {
                trip_id: activeTripId,
                accuracy: data.accuracy,
                n_predicted_arcs: data.n_predicted_arcs,
                prediction_time_ms: data.prediction_time_ms
            },
            features: [
                {
                    type: "Feature",
                    properties: { name: "GPS Raw Track" },
                    geometry: {
                        type: "LineString",
                        coordinates: data.track
                    }
                },
                {
                    type: "Feature",
                    properties: { name: "Predicted Route" },
                    geometry: {
                        type: "MultiLineString",
                        coordinates: (data.route_geometry || []).map(seg => [seg.from, seg.to])
                    }
                }
            ]
        };

        const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `pathsnap_trip_${activeTripId}.geojson`;
        a.click();
        toast(`Exported GeoJSON for Trip #${activeTripId}`);
    }

    // ── Helpers ─────────────────────────────────────────────────────────
    function handleKeyNavigation(e) {
        if (e.target.tagName === 'INPUT') return;

        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            const currIdx = trips.findIndex(t => t.trip_id === activeTripId);
            if (currIdx === -1) return;
            const nextIdx = e.key === 'ArrowDown' 
                ? Math.min(trips.length - 1, currIdx + 1) 
                : Math.max(0, currIdx - 1);
            selectTrip(trips[nextIdx].trip_id);
        } else if (e.code === 'Space') {
            e.preventDefault();
            toggleSimulation();
        }
    }

    function setIndicator(state, text) {
        const el = document.getElementById('status-indicator');
        const color = state === 'connected' ? '#10b981' : state === 'connecting' ? '#f59e0b' : '#ef4444';
        el.innerHTML = `<span style="color:${color};">●</span> ${text}`;
    }

    function showSpinner(show) {
        document.getElementById('map-spinner').classList.toggle('active', show);
    }

    function toast(msg, isErr = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.borderColor = isErr ? '#ef4444' : 'var(--border)';
        t.style.color = isErr ? '#ef4444' : 'var(--text-main)';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2800);
    }
    </script>
</body>
</html>
